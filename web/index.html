<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<title>PSY ANTHEM</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self' blob: data: https://cdn.jsdelivr.net; script-src 'self' blob:; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' data: https://cdn.jsdelivr.net; img-src 'self' data: blob:; media-src 'self' blob: data:; worker-src 'self' blob:; connect-src 'self' blob: data:;">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/space-grotesk@5.0.0/500.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/space-grotesk@5.0.0/700.css">
<link rel="stylesheet" href="./styles.css?v=62">
<link rel="icon" href="data:,">
</head>
<body>
<header>
  <h1>PSY ANTHEM</h1>
  <span class="tag">clean build · v6.2</span>
</header>

<main>
  <section class="card controls">
    <div class="row">
      <label class="field"><span>seed</span><input id="seed" type="number" value="42"></label>
      <label class="field"><span>intent</span><select id="intent"></select></label>
      <label class="field"><span>energy</span><select id="curve"></select></label>
      <label class="field"><span>root</span><select id="root"></select></label>
      <label class="field"><span>bars</span><select id="bars"></select></label>
    </div>
    <div class="row actions">
      <button id="generate" class="primary">⚡ Generate</button>
      <button id="random" class="ghost">🎲 Random</button>
    </div>
  </section>

  <section class="card playerbox">
    <button id="play" class="bigplay">▶ Play</button>
    <div id="status" class="status">Loading…</div>
    <audio id="player" controls preload="auto"></audio>
  </section>

  <section class="card">
    <canvas id="roll" width="900" height="280"></canvas>
    <div id="stats" class="stats"></div>
  </section>

  <section class="card exports">
    <button id="dlWav" class="ghost">⬇ WAV</button>
    <button id="dlMidi" class="ghost">⬇ MIDI</button>
  </section>
</main>

<footer>PSY ANTHEM · deterministic anthem engine · same seed = same anthem</footer>
<script type="module" src="./app.js?v=62"></script>
</body>
</html>

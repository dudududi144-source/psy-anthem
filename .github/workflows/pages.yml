name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.1.44
      - name: Install
        run: bun install
      - name: Typecheck
        run: bun run typecheck
      - name: Tests
        run: bun test
      - name: Build demo site
        run: |
          mkdir -p docs
          bun build src/index.ts --target browser --format esm --minify --outfile docs/engine.mjs
          cp web/index.html docs/index.html
          cp web/styles.css docs/styles.css
          cp web/app.js docs/app.js
          cp web/state.js docs/state.js
          cp web/synth.js docs/synth.js
          cp web/presets.js docs/presets.js
          cp web/midi-lite.mjs docs/midi-lite.mjs
          cp web/render-worker.js docs/render-worker.js
          cp web/render-core.js docs/render-core.js
          echo ".nojekyll" > docs/.nojekyll || touch docs/.nojekyll
      - name: Engine bundle size gate (30KB)
        run: |
          SIZE=$(stat -c%s docs/engine.mjs)
          echo "engine.mjs size: ${SIZE} bytes"
          if [ "$SIZE" -gt 30720 ]; then echo "::error::engine bundle too large"; exit 1; fi
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

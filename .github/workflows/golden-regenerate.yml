name: Golden Regenerate

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install
        run: bun install
      - name: Generate golden MIDI files
        run: bun run scripts/generate-golden.ts
      - name: Verify file count
        run: |
          COUNT=$(ls golden-midi/*.mid | wc -l)
          echo "golden files: ${COUNT}"
          if [ "$COUNT" -ne 10 ]; then echo "::error::expected 10 golden files"; exit 1; fi
      - name: Commit golden files to main
        run: |
          git config user.name "psy-agent"
          git config user.email "psy-agent@users.noreply.github.com"
          git add golden-midi
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "feat: golden MIDI files (10 canonical configs, generated by CI)"
            git push
          fi
      - name: Upload golden-midi artifact
        uses: actions/upload-artifact@v4
        with:
          name: golden-midi
          path: golden-midi/

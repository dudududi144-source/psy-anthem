name: CI
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.1.44
      - name: Install
        run: bun install
      - name: Typecheck
        run: bun run typecheck
      - name: Unit + Integration tests
        run: bun test
      - name: Examples smoke (real runs)
        run: |
          bun run examples/01-basic-generation.ts > /dev/null
          bun run examples/02-all-intents.ts > /dev/null
          bun run examples/06-export-midi.ts > /dev/null
          test -s examples/out/psy-anthem-demo.mid
          bun scripts/cli.ts --seed 42 --bars 16 --output /tmp/ci-anthem.mid > /dev/null
          test -s /tmp/ci-anthem.mid
          bun scripts/cli.ts --help > /dev/null
          bun run examples/09-ab-testing.ts > /dev/null
          bun run examples/11-emotional-lead.ts > /dev/null
          bun run examples/12-loop-mode.ts > /dev/null
          bun run examples/13-call-response.ts > /dev/null
          bun run examples/14-extended-chords.ts > /dev/null
          bun run examples/15-all-15-presets.ts > /dev/null
          bun run scripts/verify-playback.ts
          COUNT=$(ls golden-midi/*.mid | wc -l)
          if [ "$COUNT" -ne 10 ]; then echo "::error::expected 10 golden MIDI files"; exit 1; fi
          echo "examples + CLI + golden collection OK"
      - name: Bundle
        run: bun run bundle
      - name: Bundle size gate (25KB)
        run: |
          SIZE=$(stat -c%s dist/psy-anthem.mjs)
          echo "bundle size: ${SIZE} bytes"
          if [ "$SIZE" -gt 25600 ]; then echo "::error::bundle too large"; exit 1; fi
      - name: No console.log in src/
        run: |
          if grep -rn "console\.log" src/ --include="*.ts"; then exit 1; fi
          echo "clean"
      - name: No Math.random in src/
        run: |
          if grep -rn "Math\.random" src/ --include="*.ts"; then exit 1; fi
          echo "clean"
      - name: No AudioContext in src/
        run: |
          if grep -rnE "AudioContext|OfflineAudioContext" src/ --include="*.ts"; then exit 1; fi
          echo "clean"
      - name: No secrets in repo
        run: |
          if grep -rnE "ghp_[A-Za-z0-9]{20,}|github_pa[t]_" src/ tests/ scripts/ .github/ web/ 2>/dev/null; then exit 1; fi
          echo "clean"

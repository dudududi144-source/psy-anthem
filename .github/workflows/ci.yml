name: CI
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install
        run: bun install
      - name: Typecheck
        run: bun run typecheck
      - name: Unit + Integration tests
        run: bun test
      - name: Bundle
        run: bun run bundle
      - name: Bundle size gate (20KB)
        run: |
          SIZE=$(stat -c%s dist/psy-anthem.mjs)
          echo "bundle size: ${SIZE} bytes"
          if [ "$SIZE" -gt 20480 ]; then echo "::error::bundle too large"; exit 1; fi
      - name: No console.log in src/
        run: |
          if grep -rn "console\.log" src/ --include="*.ts"; then exit 1; fi
          echo "clean"
      - name: No Math.random in src/
        run: |
          if grep -rn "Math\.random" src/ --include="*.ts"; then exit 1; fi
          echo "clean"
      - name: No AudioContext in src/
        run: |
          if grep -rnE "AudioContext|OfflineAudioContext" src/ --include="*.ts"; then exit 1; fi
          echo "clean"
      - name: No secrets in repo
        run: |
          if grep -rnE "ghp_|github_pat_" src/ tests/ scripts/ .github/ 2>/dev/null; then exit 1; fi
          echo "clean"
